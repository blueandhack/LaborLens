name: Build and Push Images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'CLAUDE.md'
      - '*.md'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/blueandhack/laborlens-backend
  FRONTEND_IMAGE: ghcr.io/blueandhack/laborlens-frontend

jobs:
  build-backend:
    # Keep the database integration environment stable across runner updates.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:9.0.4
        ports:
          - 27017:27017
        options: >-
          --user 999:999
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test importer
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: npm ci && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile.prod
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test disclosure dates and wages
        working-directory: frontend
        run: npm test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifests:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    # One tag update at a time; a queued run waits instead of racing.
    concurrency:
      group: update-manifests
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the step can tell whether main already deploys a newer commit.
          fetch-depth: 0

      - name: Update image tags and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          manifests="k8s/backend.yaml k8s/frontend.yaml k8s/auto-import.yaml k8s/employers.yaml"
          # Other commits can reach main while the images build, so start from the
          # latest main and redo the update if the push is rejected.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            deployed=$(grep -o 'laborlens-backend:[0-9a-f]\{40\}' k8s/backend.yaml | head -1 | cut -d: -f2)
            if [ -n "$deployed" ] && [ "$deployed" != "$GITHUB_SHA" ] \
              && git merge-base --is-ancestor "$GITHUB_SHA" "$deployed" 2>/dev/null; then
              echo "main already deploys newer commit $deployed; nothing to do"
              exit 0
            fi
            sed -i "s|image: .*laborlens-backend.*|image: $BACKEND_IMAGE:$GITHUB_SHA|" k8s/backend.yaml k8s/auto-import.yaml k8s/employers.yaml
            sed -i "s|image: .*laborlens-frontend.*|image: $FRONTEND_IMAGE:$GITHUB_SHA|" k8s/frontend.yaml
            git add $manifests
            git diff --cached --quiet && echo "No manifest changes" && exit 0
            git commit -m "ci: update images to ${GITHUB_SHA::8} [skip ci]"
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt); retrying on the latest main"
            sleep $((attempt * 5))
          done
          echo "Could not push manifest update after 5 attempts"
          exit 1
