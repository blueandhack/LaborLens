apiVersion: apps/v1
kind: Deployment
metadata:
  name: laborlens-backend
  namespace: laborlens
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: laborlens-backend
  template:
    metadata:
      labels:
        app: laborlens-backend
        access-mongodb: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/blueandhack/laborlens-backend:34be0e4738d227857ed8d47ad68d1f89baa0adfc
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5001
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5001
          periodSeconds: 5
          timeoutSeconds: 2
        env:
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: "--max-old-space-size=512"
        - name: PORT
          value: "5001"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: laborlens-secrets
              key: mongodb-app-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: laborlens-secrets
              key: jwt-secret
        - name: ADMIN_INIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laborlens-secrets
              key: admin-init-password
---
apiVersion: v1
kind: Service
metadata:
  name: laborlens-backend
  namespace: laborlens
spec:
  selector:
    app: laborlens-backend
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
