apiVersion: apps/v1
kind: Deployment
metadata:
  name: laborlens-backend
  namespace: laborlens
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: laborlens-backend
  template:
    metadata:
      labels:
        app: laborlens-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/blueandhack/laborlens-backend:741819b527b573d2dc8a48b80ed8d2a184adf6e4
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5001
          periodSeconds: 5
          timeoutSeconds: 2
        env:
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: "--max-old-space-size=512"
        - name: PORT
          value: "5001"
        - name: MONGO_URI
          value: "mongodb://laborlens-mongodb:27017/pwd_cases"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: laborlens-secrets
              key: jwt-secret
        - name: ADMIN_INIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laborlens-secrets
              key: admin-init-password
---
apiVersion: v1
kind: Service
metadata:
  name: laborlens-backend
  namespace: laborlens
spec:
  selector:
    app: laborlens-backend
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
