apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data-v9-skycat-pvc
  namespace: laborlens
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laborlens-mongodb
  namespace: laborlens
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: laborlens-mongodb
  template:
    metadata:
      labels:
        app: laborlens-mongodb
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mongodb
        image: mongo:9.0.4
        # Start as mongodb directly to avoid a hang in the image's gosu wrapper.
        # The existing data volume is already owned by UID/GID 999.
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
        args: ["--auth", "--wiredTigerCacheSizeGB=0.375"]
        env:
        - name: MONGO_BACKUP_URI
          valueFrom:
            secretKeyRef:
              name: laborlens-secrets
              key: mongodb-backup-local-uri
        resources:
          requests:
            memory: 640Mi
            cpu: 100m
          limits:
            memory: 1536Mi
        ports:
        - containerPort: 27017
        startupProbe:
          tcpSocket:
            port: 27017
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 27017
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 27017
          # Large imports can briefly delay the TCP listener. Restart only
          # after sustained failure, rather than interrupting a healthy write.
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 18
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data-v9-skycat-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: laborlens-mongodb
  namespace: laborlens
spec:
  selector:
    app: laborlens-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
# MongoDB currently uses an existing persistent volume without database auth.
# Constrain its network trust boundary to the application jobs that need it;
# backup dumps execute inside this MongoDB pod and use loopback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laborlens-mongodb-ingress
  namespace: laborlens
spec:
  podSelector:
    matchLabels:
      app: laborlens-mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access-mongodb: "true"
      ports:
        - protocol: TCP
          port: 27017
