apiVersion: batch/v1
kind: CronJob
metadata:
  name: laborlens-insights-refresh
  namespace: laborlens
spec:
  schedule: "45 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: skycat
          containers:
          - name: insights
            image: ghcr.io/blueandhack/laborlens-backend:bb59040a2351fe1aafcaffc0676e4f69e0fb105d
            imagePullPolicy: Always
            command: ["node", "scripts/refresh-insights.js"]
            env:
            - name: MONGO_URI
              value: "mongodb://laborlens-mongodb:27017/pwd_cases"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=96"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 192Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: laborlens-auto-import
  namespace: laborlens
spec:
  suspend: false
  # Sunday 03:00 Pacific, including daylight saving time changes.
  schedule: "0 3 * * 0"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: laborlens-auto-import
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # Keep import memory and CPU off the small control-plane node.
          nodeSelector:
            kubernetes.io/hostname: skycat
          containers:
          - name: importer
            image: ghcr.io/blueandhack/laborlens-backend:bb59040a2351fe1aafcaffc0676e4f69e0fb105d
            imagePullPolicy: Always
            command: ["node", "scripts/auto-import.js", "--max-files=6"]
            env:
            - name: MONGO_URI
              value: "mongodb://laborlens-mongodb:27017/pwd_cases"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "1"
                memory: 1Gi
                ephemeral-storage: 3Gi
            volumeMounts:
            - name: temp
              mountPath: /tmp
          volumes:
          - name: temp
            emptyDir:
              sizeLimit: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: laborlens-history-import
  namespace: laborlens
spec:
  suspend: false
  # Resume two archived files per hour, oldest first, until coverage is complete.
  # Completed files are skipped without downloading them again.
  schedule: "15 * * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: laborlens-history-import
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # Keep import memory and CPU off the small control-plane node.
          nodeSelector:
            kubernetes.io/hostname: skycat
          containers:
          - name: importer
            image: ghcr.io/blueandhack/laborlens-backend:bb59040a2351fe1aafcaffc0676e4f69e0fb105d
            imagePullPolicy: Always
            command: ["node", "scripts/auto-import.js", "--from-year=2008", "--max-files=2", "--backfill", "--programs=pwd,perm,h1b"]
            env:
            - name: MONGO_URI
              value: "mongodb://laborlens-mongodb:27017/pwd_cases"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "1"
                memory: 1Gi
                ephemeral-storage: 3Gi
            volumeMounts:
            - name: temp
              mountPath: /tmp
          volumes:
          - name: temp
            emptyDir:
              sizeLimit: 2Gi
