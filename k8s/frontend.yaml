apiVersion: apps/v1
kind: Deployment
metadata:
  name: laborlens-frontend
  namespace: laborlens
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: laborlens-frontend
  template:
    metadata:
      labels:
        app: laborlens-frontend
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: ghcr.io/blueandhack/laborlens-frontend:84cc458bf95cb039f6e177b8d6eb997c612e455d
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: laborlens-frontend
  namespace: laborlens
spec:
  selector:
    app: laborlens-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
