apiVersion: batch/v1
kind: CronJob
metadata:
  name: laborlens-employer-refresh
  namespace: laborlens
spec:
  schedule: "30 2 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: laborlens-employer-refresh
            access-mongodb: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: skycat
          containers:
          - name: refresh
            image: ghcr.io/blueandhack/laborlens-backend:84cc458bf95cb039f6e177b8d6eb997c612e455d
            imagePullPolicy: Always
            command: ["node", "scripts/refresh-employers.js", "--worksites", "--directory", "--map", "--profiles"]
            env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: laborlens-secrets
                  key: mongodb-app-uri
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 768Mi
