apiVersion: batch/v1
kind: CronJob
metadata:
  name: laborlens-employer-refresh
  namespace: laborlens
spec:
  schedule: "30 2 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: laborlens-employer-refresh
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: skycat
          containers:
          - name: refresh
            image: ghcr.io/blueandhack/laborlens-backend:dfbd460d11792c1d878b8ae4a9024baa99829d0e
            imagePullPolicy: Always
            command: ["node", "scripts/refresh-employers.js", "--worksites", "--directory", "--profiles"]
            env:
            - name: MONGO_URI
              value: "mongodb://laborlens-mongodb:27017/pwd_cases"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 768Mi
