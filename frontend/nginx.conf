# Search combinations are useful shareable URLs, but only clean program pages
# are landing pages for indexing. Layout/tracking parameters keep their canonical.
map $args $search_variant {
    default "";
    ~*(^|&)(company|employer|employerGroup|jobTitle|location|worksite|worksiteState|caseNumber|determinationYear|decisionYear|receivedYear|page|sort)=[^&]+ "-filtered";
}

# Map views are shareable; only the default view is indexed.
map $args $map_robots {
    default "";
    ~*(^|&)(program|year|occupation|metric|view)=[^&]+ "noindex, follow";
}

# USCIS approval views are shareable; only the default view is indexed.
map $args $uscis_robots {
    default "";
    ~*(^|&)(fy|state|industry|q|sort|page)=[^&]+ "noindex, follow";
}

map $args $i140_robots {
    default "";
    ~*(^|&)(category|country)=[^&]+ "noindex, follow";
}

map $search_variant $search_robots {
    default "";
    "-filtered" "noindex, follow";
}

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite content hashes make these assets safe to reuse across visits.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = / {
        try_files /seo/pwd$search_variant.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $search_robots always;
    }

    location = /h1b {
        try_files /seo/h1b$search_variant.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $search_robots always;
    }

    location = /perm {
        try_files /seo/perm$search_variant.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $search_robots always;
    }

    location = /employers {
        try_files /seo/employers.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ "^/employers/[a-z0-9-]+--[a-f0-9]{24}$" {
        try_files /app.html =404;
    }

    location = /map {
        try_files /seo/map.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $map_robots always;
    }

    location = /h1b-approvals {
        try_files /seo/h1b-approvals.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $uscis_robots always;
    }

    location = /i140 {
        try_files /seo/i140.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $i140_robots always;
    }

    location = /data {
        try_files /seo/data.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(h1b|perm|data|map|h1b-approvals|i140)/$ {
        return 301 /$1$is_args$args;
    }

    location = /import { return 301 /admin/data$is_args$args; }
    location = /import/ { return 301 /admin/data$is_args$args; }
    location = /admin/data/ { return 301 /admin/data$is_args$args; }
    location = /admin/data {
        try_files /seo/admin.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location ^~ /backups/ {
        try_files $uri $uri/ =404;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location ~ "^/cases/[a-fA-F0-9]{24}$" {
        try_files /app.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Generated HTML is reached through the canonical route, not its build path.
    location ^~ /seo/ { internal; }
    location = /app.html { internal; }
    location = /profile-shell.html { internal; }
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location / {
        index  index.html index.htm;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
