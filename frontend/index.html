  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Apply the saved theme before stylesheets or React can paint the page. -->
  <script>
    (() => {
      let theme = 'dark';
      try { if (localStorage.getItem('theme') === 'light') theme = 'light'; } catch { /* Storage can be unavailable. */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root { color-scheme: dark; background-color: var(--bg-primary, #14181a); }
    :root[data-theme="light"] { color-scheme: light; background-color: var(--bg-primary, #e7e2d0); }
  </style>
